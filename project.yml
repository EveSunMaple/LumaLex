name: LumaLex
options:
  bundleIdPrefix: com.lumalex
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LumaLex:
    type: application
    platform: iOS
    sources:
      - path: LumaLex
        excludes:
          - Info.plist
          - Resources/**
      - path: LumaLex/Resources/Demo.wav
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumalex.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LumaLex/Info.plist
    dependencies:
      - target: LumaLexWidgets
        embed: true
  LumaLexWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - Info.plist
      - path: LumaLex/LiveActivity/LumaLexActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumalex.app.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
  LumaLexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LumaLex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumalex.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LumaLex.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LumaLex"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  LumaLex:
    build:
      targets:
        LumaLex: all
        LumaLexTests: [test]
    test:
      targets:
        - LumaLexTests
